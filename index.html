<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hornet Tracker - Interface de Contrôle</title>
    <style>
        /* STYLES CSS PURS ET AUTONOMES (ZÉRO SERVEUR INTERNET EXTREMEMENT RAPIDE) */
        body { padding: 15px; background-color: #f8f9fa; font-family: sans-serif; text-align: center; }
        .container { max-width: 450px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin: 20px auto; text-align: left; }
        h3 { text-align: center; margin-bottom: 15px; color: #212529; }
        .status-box { text-align: center; margin-bottom: 15px; font-size: 14px; }
        .status-connected { color: #198754; font-weight: bold; }
        .status-disconnected { color: #dc3545; font-weight: bold; }
        
        /* Boutons de l'interface */
        .btn { display: block; width: 100%; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; text-align: center; box-sizing: border-box; }
        .btn-main-connect { height: 55px; font-size: 18px; background-color: #0d6efd; color: white; margin-bottom: 15px; }
        .btn-main-connect:hover { background-color: #0b5ed7; }
        
        .row-grid { display: flex; gap: 8px; margin-bottom: 20px; }
        .col-grid { flex: 1; }
        .btn-action { padding: 12px 5px; font-size: 13px; color: white; }
        .btn-lire { background-color: #198754; }
        .btn-vider { background-color: #ffc107; color: #212529; }
        .btn-ecran { background-color: #6c757d; }
        
        /* États désactivés (Opacité) */
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        
        /* Console et boutons inférieurs */
        .console { background-color: #212529; color: #0dfd0d; font-family: monospace; padding: 12px; border-radius: 4px; height: 220px; overflow-y: auto; margin-top: 15px; font-size: 12px; white-space: pre-wrap; }
        .flex-footer { display: flex; gap: 10px; justify-content: center; margin-top: 15px; }
        .btn-sm { padding: 6px 12px; font-size: 12px; background-color: white; border: 1px solid #ccc; color: #212529; border-radius: 4px; width: auto; }
        .btn-download-active { border-color: #0d6efd; color: #0d6efd; }
    </style>
</head>
<body>

<div class="container">
    <h3>
        <!-- Icône de frelon en couleur intégrée librement -->
        <img src="https://icons8.com" alt="Frelon" style="width: 32px; height: 32px; vertical-align: middle; margin-right: 8px;">
        Hornet Tracker v1.1.4
    </h3>
    
    <div class="status-box">
        <span>Statut : </span>
        <span id="bleStatus" class="status-disconnected">Déconnecté</span>
    </div>

    <!-- BOUTON XXL DE CONNEXION -->
    <button class="btn btn-main-connect" id="btnConnect" onclick="connecterBLE()">CONNEXION BLUETOOTH</button>

    <!-- GRILLE DES BOUTONS SECONDAIRES -->
    <div class="row-grid">
        <div class="col-grid">
            <button class="btn btn-action btn-lire" id="btnLire" onclick="envoyerCommande('LIRE')" disabled>Lire Logs</button>
        </div>
        <div class="col-grid">
            <button class="btn btn-action btn-vider" id="btnVider" onclick="envoyerCommande('VIDER')" disabled>Vider Flash</button>
        </div>
        <div class="col-grid">
            <button class="btn btn-action btn-ecran" id="btnEcran" onclick="basculerEcran()" disabled>ÉCRAN: ON</button>
        </div>
    </div>

    <h6>Console de Réception (Données CSV) :</h6>
    <div id="consoleOut" class="console">En attente de connexion...</div>
    
    <div class="flex-footer">
        <button class="btn btn-sm btn-download-active" id="btnDownload" onclick="telechargerFichierCSV()" disabled>📥 Télécharger CSV</button>
        <button class="btn btn-sm" onclick="effacerConsole()">Effacer console</button>
    </div>
</div>

<script>
const SERVICE_UUID           = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
const CHARACTERISTIC_UUID_RX = "beb5483e-36e1-4688-b7f5-ea07361b26a8"; 
const CHARACTERISTIC_UUID_TX = "1b4e28bf-2baf-4253-93ec-d368e19a6d01"; 

let bleDevice = null;
let rxCharacteristic = null; 
let oledAllume = true;       

function connecterBLE() {
    if (!navigator.bluetooth) {
        logConsole("❌ Erreur : Web Bluetooth non supporté.");
        return;
    }
    logConsole("Démarrage du scan Bluetooth...");
    navigator.bluetooth.requestDevice({
        filters: [{ name: 'Heltec_Frelon_Tracker' }],
        optionalServices: [SERVICE_UUID]
    })
    .then(device => {
        bleDevice = device;
        bleDevice.addEventListener('gattserverdisconnected', onDisconnected);
        return device.gatt.connect();
    })
    .then(server => {
        return server.getPrimaryService(SERVICE_UUID);
    })
    .then(service => {
        return service.getCharacteristic(CHARACTERISTIC_UUID_RX).then(char => {
            rxCharacteristic = char;
            return service.getCharacteristic(CHARACTERISTIC_UUID_TX);
        });
    })
    .then(characteristic => {
        return characteristic.startNotifications().then(() => {
            characteristic.addEventListener('characteristicvaluechanged', handleNotifications);
            logConsole("✅ Hornet Tracker connecté avec succès !");
            setConnectedUI(true);
            synchroniserDate();
        });
    })
    .catch(error => {
        logConsole("❌ Échec : " + error);
        setConnectedUI(false);
    });
}

function handleNotifications(event) {
    let value = event.target.value;
    let decoder = new TextDecoder('utf-8');
    let strData = decoder.decode(value);
    logConsole(strData);
}

// Fonction d'envoi d'ordres d'origine
function envoyerCommande(chaine) {
    if (rxCharacteristic) {
        let encoder = new TextEncoder();
        rxCharacteristic.writeValue(encoder.encode(chaine))
            .catch(error => { logConsole("❌ Erreur transmission : " + error); });
    }
}

// Interrupteur d'écran ON / OFF matériel
function basculerEcran() {
    const bouton = document.getElementById('btnEcran');
    if (!rxCharacteristic) return;
    if (oledAllume) {
        envoyerCommande("ECRAN_OFF");
        bouton.innerText = "ÉCRAN: OFF";
        bouton.style.backgroundColor = "#dc3545"; // Rouge
        oledAllume = false;
    } else {
        envoyerCommande("ECRAN_ON");
        bouton.innerText = "ÉCRAN: ON";
        bouton.style.backgroundColor = "#198754"; // Vert
        oledAllume = true;
    }
}

// Téléchargement du fichier CSV automatique
function telechargerFichierCSV() {
    const texteConsole = document.getElementById('consoleOut').innerText;
    const lignesUniquement = texteConsole.split("\n").filter(ligne => {
        return ligne.includes(";") && !ligne.includes("---") && !ligne.includes("Connecté");
    }).join("\n");

    if(lignesUniquement.length === 0) {
        alert("Aucune donnée CSV valide présente dans la console !");
        return;
    }

    const blob = new Blob(["\ufeff" + lignesUniquement], { type: 'text/csv;charset=utf-8;' });
    const lien = document.createElement("a");
    const dateSysteme = new Date();
    lien.download = `frelons_export_${dateSysteme.getDate()}_${dateSysteme.getMonth()+1}.csv`;
    lien.href = window.URL.createObjectURL(blob);
    lien.style.display = "none";
    document.body.appendChild(lien);
    lien.click();
    document.body.removeChild(lien);
}

// Synchronisation de la date d'usine
function synchroniserDate() {
    const now = new Date();
    const dateFormatee = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
    setTimeout(() => { envoyerCommande(dateFormatee); }, 600);
}

function setConnectedUI(connected) {
    const status = document.getElementById('bleStatus');
    const btnConnect = document.getElementById('btnConnect');
    const btnEcran = document.getElementById('btnEcran');
    
    document.getElementById('btnLire').disabled = !connected;
    document.getElementById('btnVider').disabled = !connected;
    btnEcran.disabled = !connected;
    document.getElementById('btnDownload').disabled = !connected;

    if (connected) {
        status.innerText = "Connecté";
        status.className = "status-connected";
        btnConnect.innerText = "DÉCONNECTER SUR L'IPHONE";
        btnConnect.style.backgroundColor = "#dc3545";
        btnConnect.setAttribute("onclick", "deconnecterBLE()");
        btnEcran.style.backgroundColor = "#198754"; // Vert par défaut
    } else {
        status.innerText = "Déconnecté";
        status.className = "status-disconnected";
        btnConnect.innerText = "CONNEXION BLUETOOTH";
        btnConnect.style.backgroundColor = "#0d6efd";
        btnConnect.setAttribute("onclick", "connecterBLE()");
        btnEcran.innerText = "ÉCRAN: ON";
        btnEcran.style.backgroundColor = "#6c757d"; // Gris neutre
        oledAllume = true;
    }
}

function deconnecterBLE() { if (bleDevice && bleDevice.gatt.connected) { bleDevice.gatt.disconnect(); } }
function onDisconnected() { logConsole("🔌 Déconnexion du Hornet Tracker."); setConnectedUI(false); }
function logConsole(text) { const consoleOut = document.getElementById('consoleOut'); consoleOut.innerText += text + "\n"; consoleOut.scrollTop = consoleOut.scrollHeight; }
function effacerConsole() { document.getElementById('consoleOut').innerText = ""; }
</script>
</body>
</html>
