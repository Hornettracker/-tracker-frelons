<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frelon Tracker - Contrôle</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f4f4f9; padding: 20px; text-align: center; color: #333; }
        h1 { color: #2c3e50; font-size: 24px; margin-bottom: 5px; }
        .status { font-weight: bold; padding: 10px; margin: 15px auto; max-width: 400px; border-radius: 8px; background: #e0e0e0; }
        .connected { background: #2ecc71; color: white; }
        .btn { display: block; width: 100%; max-width: 400px; margin: 12px auto; padding: 15px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .btn-connect { background: #3498db; color: white; }
        .btn-sync { background: #f39c12; color: white; }
        .btn-read { background: #9b59b6; color: white; }
        .btn-clear { background: #e74c3c; color: white; }
        #console { width: 100%; max-width: 380px; height: 180px; margin: 15px auto; padding: 10px; background: #2c3e50; color: #2ecc71; font-family: monospace; font-size: 11px; text-align: left; overflow-y: scroll; border-radius: 8px; }
    </style>
</head>
<body>

    <h1>🐝 Frelon Tracker V1.1</h1>
    <p style="font-size:12px; color:#666;">Outils de déchargement automatique</p>

    <div id="bleStatus" class="status">Déconnecté</div>

    <button class="btn btn-connect" onclick="connectBLE()">1. Connexion au Tracker</button>
    <button class="btn btn-sync" onclick="synchroniserHeure()" disabled id="btnSync">2. Synchroniser l'Heure</button>
    <button class="btn btn-read" onclick="demanderDonnees()" disabled id="btnRead">3. Télécharger le CSV</button>
    <button class="btn btn-clear" onclick="viderMemoire()" disabled id="btnClear">4. Vider la Mémoire</button>

    <h3>Flux de Réception :</h3>
    <div id="console">En attente de connexion...</div>

    <script>
        const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const TX_CHARACTERISTIC_UUID = "1b4e28bf-2baf-4253-93ec-d368e19a6d01";
        const RX_CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

        let gattServer = null;
        let rxCharacteristic = null;
        let txCharacteristic = null;
        let csvAccumulateur = "";

        function log(msg) {
            const cons = document.getElementById("console");
            cons.innerHTML += msg + "<br>";
            cons.scrollTop = cons.scrollHeight;
        }

        async function connectBLE() {
            try {
                log("Recherche du tracker...");
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'Heltec_Frelon_Tracker' }],
                    optionalServices: [SERVICE_UUID]
                });

                log("Connexion à l'appareil...");
                gattServer = await device.gatt.connect();
                
                const service = await gattServer.getPrimaryService(SERVICE_UUID);
                rxCharacteristic = await service.getCharacteristic(RX_CHARACTERISTIC_UUID);
                txCharacteristic = await service.getCharacteristic(TX_CHARACTERISTIC_UUID);

                await txCharacteristic.startNotifications();
                txCharacteristic.addEventListener('characteristicvaluechanged', gererDonneesRecues);

                document.getElementById("bleStatus").innerText = "Connecté !";
                document.getElementById("bleStatus").className = "status connected";
                
                document.getElementById("btnSync").disabled = false;
                document.getElementById("btnRead").disabled = false;
                document.getElementById("btnClear").disabled = false;
                
                log("Système Prêt !");
            } catch (error) {
                log("Erreur : " + error);
            }
        }

        function gererDonneesRecues(event) {
            let enc = new TextDecoder("utf-8");
            let texte = enc.decode(event.target.value);
            
            if (texte.includes("--- DEBUT EXPORT CSV ---")) {
                csvAccumulateur = "";
                log("Téléchargement commencé...");
                return;
            }
            
            if (texte.includes("--- FIN EXPORT CSV ---")) {
                log("Téléchargement Terminé ! Création du fichier...");
                telechargerFichierCSV(csvAccumulateur);
                return;
            }

            if(!texte.startsWith("INFO:")) {
                csvAccumulateur += texte + "\n";
            }
            log(texte);
        }

        async function synchroniserHeure() {
            const maintenant = new Date();
            const pad = (n) => String(n).padStart(2, '0');
            const dateStr = `${maintenant.getFullYear()}-${pad(maintenant.getMonth()+1)}-${pad(maintenant.getDate())} ${pad(maintenant.getHours())}:${pad(maintenant.getMinutes())}:${pad(maintenant.getSeconds())}`;
            
            let enc = new TextEncoder();
            await rxCharacteristic.writeValue(enc.encode(dateStr));
            log("Heure envoyée : " + dateStr);
        }

        async function demanderDonnees() {
            let enc = new TextEncoder();
            await rxCharacteristic.writeValue(enc.encode("LIRE"));
            log("Demande d'exportation envoyée...");
        }

        async function viderMemoire() {
            if (confirm("Voulez-vous vraiment effacer définitivement les logs stockés sur la carte Heltec ?")) {
                let enc = new TextEncoder();
                await rxCharacteristic.writeValue(enc.encode("VIDER"));
                log("Ordre d'effacement envoyé.");
            }
        }

        function telechargerFichierCSV(contenu) {
    // On crée un fichier texte virtuel avec vos données
    const blob = new Blob([contenu], { type: 'text/csv;charset=utf-8;' });
    const fichier = new File([blob], `logs_frelons_${new Date().toISOString().substring(0,10)}.csv`, {type: "text/csv"});

    // On utilise l'API de partage native de l'iPhone (Partage de fichier)
    if (navigator.share) {
        navigator.share({
            files: [fichier],
            title: 'Logs Frelons',
            text: 'Fichier d\'exportation du tracker'
        }).then(() => log("Fichier partagé avec succès !"))
          .catch((error) => log("Partage annulé : " + error));
    } else {
        // Solution de secours si le partage natif échoue
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `logs_frelons_${new Date().toISOString().substring(0,10)}.csv`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }
}
    </script>
</body>
</html>
