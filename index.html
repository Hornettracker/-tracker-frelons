<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hornet Tracker - Terminal</title>
    <style>
        body { padding: 20px; background-color: #f8f9fa; font-family: sans-serif; text-align: center; }
        .container { max-width: 450px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin: 20px auto; text-align: left; }
        h3 { text-align: center; color: #212529; }
        .version-tag { text-align: center; font-size: 11px; color: #6c757d; margin-bottom: 15px; font-weight: bold; }
        
        /* --- AJOUT DU BANDEAU GRAPHIQUE DE LA BATTERIE --- */
        .battery-box { text-align: center; background-color: #f1f3f5; padding: 12px; border-radius: 6px; margin-bottom: 15px; font-size: 18px; font-weight: bold; color: #212529; }
        .battery-low { color: #dc3545; animation: clignotementAlerte 1s infinite; }
        
        @keyframes clignotementAlerte {
            0% { opacity: 1.0; }
            50% { opacity: 0.2; }
            100% { opacity: 1.0; }
        }

        .btn { display: block; width: 100%; padding: 15px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; text-align: center; font-size: 16px; margin-bottom: 10px; }
        .btn-blue { background-color: #0d6efd; color: white; }
        .btn-green { background-color: #198754; color: white; }
        .btn-orange { background-color: #ffc107; color: #212529; }
        .btn-grey { background-color: #6c757d; color: white; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .console { background-color: #212529; color: #0dfd0d; font-family: monospace; padding: 12px; border-radius: 4px; height: 220px; overflow-y: auto; margin-top: 15px; font-size: 12px; white-space: pre-wrap; }
    </style>
</head>
<body>

<div class="container">
    <h3>Hornet Tracker v1.1.6c</h3>
    <div class="version-tag">Version de Terrain validée à : 15h35</div>

    <!-- AFFICHAGE DE LA TENSION DEMANDÉE -->
    <div id="batteryDisplay" class="battery-box">
        Tension Batterie : -- V
    </div>

    <button class="btn btn-blue" id="btnConnect" onclick="connecterBLE()">CONNEXION BLUETOOTH</button>
    <button class="btn btn-green" id="btnLire" onclick="envoyerCommande('LIRE')" disabled>Lire Logs</button>
    <button class="btn btn-orange" id="btnVider" onclick="envoyerCommande('VIDER')" disabled>Vider Flash</button>
    <button class="btn btn-grey" id="btnEcran" onclick="basculerEcran()" disabled>ÉCRAN : ALLUMÉ</button>

    <h6>Données reçues :</h6>
    <div id="consoleOut" class="console">En attente de connexion...</div>
</div>

<script>
const SERVICE_UUID           = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
const CHARACTERISTIC_UUID_RX = "beb5483e-36e1-4688-b7f5-ea07361b26a8"; 
const CHARACTERISTIC_UUID_TX = "1b4e28bf-2baf-4253-93ec-d368e19a6d01"; 

let bleDevice = null;
let rxCharacteristic = null; 
let oledAllume = true;       

function connecterBLE() {
    logConsole("Recherche du tracker...");
    navigator.bluetooth.requestDevice({
        filters: [{ name: 'Heltec_Frelon_Tracker' }],
        optionalServices: [SERVICE_UUID]
    })
    .then(device => {
        bleDevice = device;
        bleDevice.addEventListener('gattserverdisconnected', onDisconnected);
        return device.gatt.connect();
    })
    .then(server => {
        return server.getPrimaryService(SERVICE_UUID);
    })
    .then(service => {
        service.getCharacteristic(CHARACTERISTIC_UUID_RX).then(char => { rxCharacteristic = char; });
        return service.getCharacteristic(CHARACTERISTIC_UUID_TX);
    })
    .then(characteristic => {
        return characteristic.startNotifications().then(() => {
            characteristic.addEventListener('characteristicvaluechanged', function(event) {
                let data = new TextDecoder('utf-8').decode(event.target.value);
                logConsole(data);
                
                // --- EXTRACTEUR AUTOMATIQUE DE TENSION SANS TOUCHER AU MOTEUR ---
                if (data.includes(";")) {
                    let segments = data.trim().split(";");
                    let tensionBrute = parseFloat(segments[segments.length - 1]);
                    
                    if (!isNaN(tensionBrute) && tensionBrute > 2.0 && tensionBrute < 5.0) {
                        const batBox = document.getElementById('batteryDisplay');
                        batBox.innerText = "Tension Batterie : " + tensionBrute.toFixed(2) + " V";
                        
                        // Alerte clignotante sous les 3.45V pour la décharge réelle
                        if (tensionBrute <= 3.45) {
                            batBox.className = "battery-box battery-low";
                        } else {
                            batBox.className = "battery-box";
                        }
                    }
                }
            });
            logConsole("✅ Connecté !");
            setConnectedUI(true);
        });
    })
    .catch(error => {
        logConsole("❌ Erreur : " + error);
        setConnectedUI(false);
    });
}

function deconnecterBLE() {
    if (bleDevice && bleDevice.gatt.connected) {
        logConsole("Fermeture de la session Bluetooth...");
        bleDevice.gatt.disconnect();
    }
}

function onDisconnected() {
    logConsole("🔌 Déconnecté proprement.");
    setConnectedUI(false);
}

function envoyerCommande(chaine) {
    if (rxCharacteristic) {
        rxCharacteristic.writeValue(new TextEncoder().encode(chaine));
    }
}

function basculerEcran() {
    const bouton = document.getElementById('btnEcran');
    if (oledAllume) {
        envoyerCommande("ECRAN_OFF");
        bouton.innerText = "ÉCRAN : ÉTEINT";
        oledAllume = false;
    } else {
        envoyerCommande("ECRAN_ON");
        bouton.innerText = "ÉCRAN : ALLUMÉ";
        oledAllume = true;
    }
}

function setConnectedUI(connected) {
    const btnConnect = document.getElementById('btnConnect');
    document.getElementById('btnLire').disabled = !connected;
    document.getElementById('btnVider').disabled = !connected;
    document.getElementById('btnEcran').disabled = !connected;
    
    if (connected) {
        btnConnect.innerText = "DÉCONNECTER";
        btnConnect.setAttribute("onclick", "deconnecterBLE()"); 
    } else {
        btnConnect.innerText = "CONNEXION BLUETOOTH";
        btnConnect.setAttribute("onclick", "connecterBLE()"); 
        document.getElementById('btnEcran').innerText = "ÉCRAN : ALLUMÉ";
        document.getElementById('batteryDisplay').innerText = "Tension Batterie : -- V";
        document.getElementById('batteryDisplay').className = "battery-box";
        oledAllume = true;
    }
}

function logConsole(text) {
    const out = document.getElementById('consoleOut');
    out.innerText += text + "\n";
    out.scrollTop = out.scrollHeight; 
}
</script>
</body>
</html>
