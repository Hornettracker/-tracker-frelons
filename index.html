<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hornet Tracker - Interface de Contrôle</title>
    <!-- Style Bootstrap épuré pour iPhone -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style>
        body { padding: 15px; background-color: #f8f9fa; font-family: sans-serif; }
        .container { max-width: 500px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin: auto; }
        .console { background-color: #212529; color: #0dfd0d; font-family: monospace; padding: 12px; border-radius: 4px; height: 220px; overflow-y: auto; margin-top: 15px; font-size: 13px; white-space: pre-wrap; }
        .status-connected { color: #198754; font-weight: bold; font-size: 16px; }
        .status-disconnected { color: #dc3545; font-weight: bold; font-size: 16px; }
        .btn-action { padding: 12px; font-weight: bold; font-size: 14px; }
        .btn-main-connect { width: 100%; height: 55px; font-size: 18px; font-weight: bold; margin-bottom: 15px; display: block; }
    </style>
</head>
<body>

<div class="container mt-2">
    <h3 class="text-center mb-3">🐝 Hornet Tracker v1.1.4</h3>
    
    <div class="mb-3 text-center">
        <span>Statut : </span>
        <span id="bleStatus" class="status-disconnected">Déconnecté</span>
    </div>

    <!-- BOUTON DE CONNEXION PRINCIPAL XXL POUR IPHONE -->
    <button class="btn btn-primary btn-main-connect" id="btnConnect" onclick="connecterBLE()">CONNEXION BLUETOOTH</button>

    <!-- Grille des boutons d'action secondaires -->
    <div class="row g-2 mb-4">
        <div class="col-4">
            <button class="btn btn-success w-100 btn-action" id="btnLire" onclick="envoyerCommande('LIRE')" disabled>Lire Logs</button>
        </div>
        <div class="col-4">
            <button class="btn btn-warning text-white w-100 btn-action" id="btnVider" onclick="envoyerCommande('VIDER')" disabled>Vider Flash</button>
        </div>
        <div class="col-4">
            <button class="btn btn-secondary w-100 btn-action" id="btnEcran" onclick="basculerEcran()" disabled>ÉCRAN: ON</button>
        </div>
    </div>

    <h6>Console de Réception (Données CSV) :</h6>
    <div id="consoleOut" class="console">En attente de connexion...</div>
    
    <div class="mt-3 text-center">
        <button class="btn btn-outline-secondary btn-sm" onclick="effacerConsole()">Effacer la console</button>
    </div>
</div>

<script>
// --- UUID STRICTS DE PRODUCTION DE VOTRE HELTEC ---
const SERVICE_UUID           = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
const CHARACTERISTIC_UUID_RX = "beb5483e-36e1-4688-b7f5-ea07361b26a8"; 
const CHARACTERISTIC_UUID_TX = "1b4e28bf-2baf-4253-93ec-d368e19a6d01"; 

let bleDevice = null;
let rxCharacteristic = null; 
let oledAllume = true;       

function connecterBLE() {
    // 🔍 ÉTAPE 1 : Validation de l'environnement iOS
    if (!navigator.bluetooth) {
        logConsole("❌ Erreur : L'API Web Bluetooth est bloquée ou non supportée par ce navigateur.");
        alert("Web Bluetooth indisponible. Vérifiez les autorisations de Bluefy dans les Réglages de l'iPhone.");
        return;
    }

    logConsole("Démarrage du scan Bluetooth...");
    navigator.bluetooth.requestDevice({
        filters: [{ name: 'Heltec_Frelon_Tracker' }],
        optionalServices: [SERVICE_UUID]
    })
    .then(device => {
        bleDevice = device;
        bleDevice.addEventListener('gattserverdisconnected', onDisconnected);
        logConsole("Appareil détecté. Connexion au serveur GATT...");
        return device.gatt.connect();
    })
    .then(server => {
        logConsole("Serveur connecté. Analyse du service...");
        return server.getPrimaryService(SERVICE_UUID);
    })
    .then(service => {
        logConsole("Service trouvé. Liaison de la caractéristique RX...");
        return service.getCharacteristic(CHARACTERISTIC_UUID_RX).then(char => {
            rxCharacteristic = char;
            logConsole("Liaison RX validée. Liaison du canal TX...");
            return service.getCharacteristic(CHARACTERISTIC_UUID_TX);
        });
    })
    .then(characteristic => {
        logConsole("Canal TX connecté. Activation de l'écoute...");
        return characteristic.startNotifications().then(() => {
            characteristic.addEventListener('characteristicvaluechanged', handleNotifications);
            logConsole("✅ Hornet Tracker connecté avec succès !");
            setConnectedUI(true);
            synchroniserDate(); // Synchronisation RTC automatique sécurisée
        });
    })
    .catch(error => {
        logConsole("❌ Échec de l'étape : " + error);
        setConnectedUI(false);
    });
}

function handleNotifications(event) {
    let value = event.target.value;
    let decoder = new TextDecoder('utf-8');
    let strData = decoder.decode(value);
    logConsole(strData);
}

function envoyerCommande(chaine) {
    if (rxCharacteristic) {
        let encoder = new TextEncoder();
        rxCharacteristic.writeValue(encoder.encode(chaine))
            .then(() => { console.log("Trame envoyée : " + chaine); })
            .catch(error => { logConsole("❌ Erreur de transmission : " + error); });
    } else {
        logConsole("❌ Erreur : Aucun canal de transmission actif.");
    }
}

function basculerEcran() {
    const bouton = document.getElementById('btnEcran');
    if (!rxCharacteristic) return;

    if (oledAllume) {
        envoyerCommande("ECRAN_OFF");
        bouton.innerText = "ÉCRAN: OFF";
        bouton.className = "btn btn-danger w-100 btn-action"; 
        oledAllume = false;
    } else {
        envoyerCommande("ECRAN_ON");
        bouton.innerText = "ÉCRAN: ON";
        bouton.className = "btn btn-success w-100 btn-action"; 
        oledAllume = true;
    }
}

function synchroniserDate() {
    const now = new Date();
    const dateFormatee = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
    logConsole("Envoi de la date RTC d'usine...");
    setTimeout(() => { envoyerCommande(dateFormatee); }, 600);
}

function setConnectedUI(connected) {
    const status = document.getElementById('bleStatus');
    const btnConnect = document.getElementById('btnConnect');
    
    document.getElementById('btnLire').disabled = !connected;
    document.getElementById('btnVider').disabled = !connected;
    document.getElementById('btnEcran').disabled = !connected;

    if (connected) {
        status.innerText = "Connecté";
        status.className = "status-connected";
        btnConnect.innerText = "DÉCONNECTER";
        btnConnect.className = "btn btn-danger btn-main-connect";
        btnConnect.setAttribute("onclick", "deconnecterBLE()");
    } else {
        status.innerText = "Déconnecté";
        status.className = "status-disconnected";
        btnConnect.innerText = "CONNEXION BLUETOOTH";
        btnConnect.className = "btn btn-primary btn-main-connect";
        btnConnect.setAttribute("onclick", "connecterBLE()");
        
        const btnEcran = document.getElementById('btnEcran');
        btnEcran.innerText = "ÉCRAN: ON";
        btnEcran.className = "btn btn-secondary w-100 btn-action";
        oledAllume = true;
    }
}

function deconnecterBLE() {
    if (bleDevice && bleDevice.gatt.connected) {
        bleDevice.gatt.disconnect();
    }
}

function onDisconnected() {
    logConsole("🔌 Déconnexion du Hornet Tracker.");
    setConnectedUI(false);
}

function logConsole(text) {
    const consoleOut = document.getElementById('consoleOut');
    consoleOut.innerText += text + "\n";
    consoleOut.scrollTop = consoleOut.scrollHeight; 
}

function effacerConsole() {
    document.getElementById('consoleOut').innerText = "";
}
</script>
</body>
</html>
